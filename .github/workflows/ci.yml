name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Compact compiler
        run: npm install -g @midnight-ntwrk/compact-compiler && compact --version

      - name: Compile contract
        run: npm run compile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (circuit logic, state transitions, privacy)
        run: npm test
