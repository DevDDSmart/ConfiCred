name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Compact compiler is a standalone binary released on GitHub
      # (there is no npm package). Pin the same version the project is
      # built against (0.5.3) and install it onto PATH.
      - name: Install Compact compiler 0.5.3
        run: |
          curl -sL -o /tmp/compact.tar.xz \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.3/compact-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/compact.tar.xz -C /tmp
          sudo mv /tmp/compact-x86_64-unknown-linux-musl/compact /usr/local/bin/compact
          sudo chmod +x /usr/local/bin/compact
          compact --version

      - name: Compile contract
        run: npm run compile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (circuit logic, lifecycle, privacy)
        run: npm test
