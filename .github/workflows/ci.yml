name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Compact toolchain is distributed as a launcher binary on GitHub
      # releases (there is no npm package). The launcher manages compiler
      # versions under ~/.compact; `compact update <version>` downloads the
      # requested compiler and sets it as the default. Pinned to 0.31.1 —
      # the toolchain this project is built and tested against.
      - name: Install Compact toolchain
        run: |
          curl -sL -o /tmp/compact.tar.xz \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.3/compact-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/compact.tar.xz -C /tmp
          sudo mv /tmp/compact-x86_64-unknown-linux-musl/compact /usr/local/bin/compact
          sudo chmod +x /usr/local/bin/compact
          compact update 0.31.1
          compact --version

      - name: Compile contract
        run: npm run compile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (circuit logic, lifecycle, privacy)
        run: npm test
